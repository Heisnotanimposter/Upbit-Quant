version: '3.8'

services:
  upbit-quant:
    build: .
    ports:
      - "8501:8501"
    environment:
      - DEBUG=False
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
