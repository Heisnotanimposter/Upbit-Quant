# Target Crypto Trading Pairs on Bithumb (KRW market)
symbols:
  - "BTC_KRW"
  - "ETH_KRW"
  - "XRP_KRW"
  - "SOL_KRW"

# Strategy Selector: "hybrid_rl" (Recommended), "high_turnover", or "volatility_breakout"
active_strategy: "hybrid_rl"

# Hybrid AI-RL Strategy Settings (Google AI Studio + Deep RL Dueling DQN)
hybrid_rl:
  model_path: "models/rl_agent_dueling_dqn.pt"  # Trained neural policy weights
  candle_interval: "3m"                         # Fast micro-cycle timeframe: 1m, 3m, 5m, 1h
  target_net_profit_pct: 0.35                  # Minimum net profit after all fees and slippage
  exchange_fee_pct: 0.04                       # Bithumb fee per trade (0.04% with coupon, 0.25% standard)
  slippage_buffer_pct: 0.06                    # Estimated slippage allowance
  max_hold_time_minutes: 25                    # Stale position timeout (recycles seed capital)
  tick_interval_sec: 10                        # Fast polling loop (every 10 seconds)
  reinvest_profit_pct: 100.0                   # 100% full compounding reinvestment

# High-Turnover Seed Compounding Strategy (Rule-based Scalping Alternative)
high_turnover_strategy:
  candle_interval: "3m"
  target_net_profit_pct: 0.35
  exchange_fee_pct: 0.04
  slippage_buffer_pct: 0.06
  ema_fast_period: 3
  ema_slow_period: 9
  bb_period: 20
  bb_std_dev: 2.0
  rsi_period: 14
  rsi_oversold_threshold: 42
  rsi_overbought_threshold: 68
  max_hold_time_minutes: 25
  tick_interval_sec: 10
  reinvest_profit_pct: 100.0

# Classic Volatility Breakout Strategy (Alternative Mode)
strategy:
  k_noise_ratio: 0.5
  ema_fast_period: 5
  ema_slow_period: 20
  rsi_period: 14
  rsi_max_buy: 70
  atr_period: 14
  candle_interval: "24h"

# Portfolio Risk Management & Capital Controls
risk:
  max_portfolio_allocation_pct: 95.0  # Allocate high % of seed per trade for compounding
  max_open_positions: 1               # Concentrate seed in 1 active trade at a time
  default_stop_loss_pct: 1.2          # Tight hard stop loss for micro-scalping
  daily_max_drawdown_pct: 5.0         # Emergency lock if 24h loss > 5%
  min_order_krw: 5000                 # Bithumb minimum order value in KRW
  max_single_trade_cap_krw: 10000000  # Fat-finger hard limit

# Google AI Studio Integration
ai_advisor:
  model_name: "gemini-2.5-flash"
  evaluation_interval_hours: 2        # Re-evaluate market regime every 2 hours
  enable_ai_position_scaling: true
