version: '3.8'

services:
  bithumb-quant:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: bithumb-quant-bot
    restart: always
    env_file:
      - ../.env
    volumes:
      - ../bithumb_quant.db:/app/bithumb_quant.db
      - ../logs:/app/logs
      - ../config/settings.yaml:/app/config/settings.yaml
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
